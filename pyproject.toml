[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veritaslock-cli"
version = "0.1.0"
description = "Unified admin CLI for VeritasLock (vl)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Kenneth Tomazin", email = "ktomazin@gmail.com" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "respx>=0.21",
]

[project.scripts]
vl = "vl.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vl"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
