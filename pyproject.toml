[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veritaslock-cli"
version = "0.1.0"
description = "Unified admin CLI for VeritasLock (vl)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Kenneth Tomazin", email = "ktomazin@gmail.com" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "bcrypt>=4.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
# The node agent (vl-agent-spec.md §8 item 3): Kafka with Avro and the Schema
# Registry. 2.16.0 bundles librdkafka 2.16.0 (the re-bootstrap fix); the agent
# refuses to start below it.
agent = [
    "confluent-kafka[avro,schemaregistry]>=2.16.0",
]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "respx>=0.21",
]

[project.scripts]
vl = "vl.app:main"
vl-agent = "vl.agent.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vl"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
